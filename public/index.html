<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .auth { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #162436; }
    .auth h2 { margin: 0 0 14px; font-size: 20px; }
    .auth form { display: grid; gap: 12px; }
    .auth label { display: grid; gap: 6px; color: #bfd0e5; font-size: 14px; }
    .auth input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth button { width: fit-content; padding: 10px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 800; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth-status { margin: 0 0 12px; color: #bfd0e5; }
    .auth-error { min-height: 1.4em; margin: 10px 0 0; color: #ffb6c2; font-size: 14px; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 2단계 코드 밖으로 이동</div>
    <h1>자료실</h1>
    <p>가상 메모는 정적 파일이 아니라 Vercel 서버 함수가 Supabase에서 읽어 옵니다.</p>
    <div class="notice">정적 <code>/data.json</code>에는 더 이상 메모가 없지만, <code>/api/notes</code>는 아직 인증 없이 호출할 수 있는 공개 주소입니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <div id="auth-signed-out">
        <form id="login-form">
          <label>이메일
            <input id="auth-email" type="email" autocomplete="email" required>
          </label>
          <label>비밀번호
            <input id="auth-password" type="password" autocomplete="current-password" required>
          </label>
          <button id="login-button" type="submit">로그인</button>
        </form>
      </div>
      <div id="auth-signed-in" hidden>
        <p class="auth-status"><strong>로그인됨</strong><span id="auth-user-email"></span></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';

    const SUPABASE_URL = 'https://rluscctcdfqrrfaxdeya.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dzxf7yQs2uiDOq_7CydAKA_aBoh2n6U';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const signedOut = document.querySelector('#auth-signed-out');
    const signedIn = document.querySelector('#auth-signed-in');
    const authError = document.querySelector('#auth-error');
    const userEmail = document.querySelector('#auth-user-email');
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');

    function renderAuth(session) {
      signedOut.hidden = Boolean(session);
      signedIn.hidden = !session;
      userEmail.textContent = session?.user?.email ?? '';
      authError.textContent = '';
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      renderAuth(session);
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.textContent = '';
      loginButton.disabled = true;
      const email = document.querySelector('#auth-email').value.trim();
      const passwordInput = document.querySelector('#auth-password');
      const password = passwordInput.value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      loginButton.disabled = false;
      if (error) {
        authError.textContent = error.code ? `${error.code}: ${error.message}` : error.message;
        return;
      }
      passwordInput.value = '';
    });

    logoutButton.addEventListener('click', async () => {
      authError.textContent = '';
      const { error } = await supabase.auth.signOut({ scope: 'local' });
      if (error) authError.textContent = error.code ? `${error.code}: ${error.message}` : error.message;
    });

    const list = document.querySelector('#notes');
    try {
      const response = await fetch('/api/notes', { cache: 'no-store' });
      if (!response.ok) throw new Error('서버 자료를 읽을 수 없습니다.');
      const data = await response.json();
      if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...data.notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.content;
        item.append(title, content);
        return item;
      }));
    } catch (error) {
      const item = document.createElement('li');
      item.textContent = error.message;
      list.replaceChildren(item);
    }
  </script>
</body>
</html>
